server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Taille max upload (pour les pièces jointes tickets)
    client_max_body_size 20M;

    # ── Routes API → backend FastAPI ─────────────────────────────────────────
    # Toutes les routes backend sont proxiées vers le service "backend"
    location ~ ^/(auth|tickets|users|sla|notifications|settings|ai|static)(/|$) {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (si utilisé plus tard)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeouts généreux pour les opérations IA longues
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── SPA React (React Router) ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache des assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
